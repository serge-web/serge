# separate terms of service, privacy policy, and support
# documentation.

name: PR

on:

  pull_request:
  push:
    branches:
      - master
      - develop

jobs:
  test:
  
    name: Build/Test [18.x] validation
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - name: Setup repo
        uses: actions/checkout@v4

      - name: Use Node.js version ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          
      - name : Running dependency installation
        run: yarn install
        
      - name : Running project building
        run: yarn build
        
      - name : Running unit testing
        run: yarn test-unit
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2 \
            libatk-bridge2.0-0 \
            libatk1.3-0 \
            libatspi2.0-0 \
            libcups2 \
            libdrm2 \
            libgbm1 \
            libgtk-3-0 \
            libnspr4 \
            libnss3 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxkbcommon0 \
            libxrandr2 \
            libxshmfence1 \
            libxss1 \
            libxtst6 \
            xvfb \
            libx264-dev \
            libffi-dev

      - name: Install Playwright
        run: npx playwright install --with-deps

      - name: Running playwright testing
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x1024x24 > /dev/null 2>&1 &
          setsid yarn develop >/dev/null 2>&1 < /dev/null & 
          sleep 1m && yarn test-playwright
        
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: /home/runner/work/serge/serge/e2e/playwright_test/playwright-report/
          retention-days: 30

      - name : Build executable files
        run: yarn pkg-build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux_executable
          path: /home/runner/work/serge/serge/executable/builds/*_linux.zip
          if-no-files-found: error
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos_executable
          path: /home/runner/work/serge/serge/executable/builds/*_macos.zip
          if-no-files-found: error

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: win64_executable
          path: /home/runner/work/serge/serge/executable/builds/*_win64.zip
          if-no-files-found: error